services:
  db:
    image: postgres:17
    container_name: bridgescope-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: bridgescope
      POSTGRES_USER: bridgescope
      POSTGRES_PASSWORD: testpassword

    ports:
      - "5432:5432"

    volumes:
      - bridgescope_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgescope -d bridgescope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bridgescope_postgres_data: